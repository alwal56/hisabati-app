name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hisabati-app/package-lock.json

      - name: Install dependencies
        working-directory: hisabati-app
        run: npm ci

      - name: Build
        working-directory: hisabati-app
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hisabati-app/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
